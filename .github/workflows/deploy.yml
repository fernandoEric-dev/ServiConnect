name: Deploy to InfinityFree

on:
    push:
        branches:
            - main

jobs:
    ftp-deploy:
        runs-on: ubuntu-latest

        steps:
            # 1. Baixa o código
            - name: Check out code
              uses: actions/checkout@v4

            # 1.1 Prepara o PHP
            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.2'

            - name: Verificar sintaxe antes de publicar
              run: find . -type f -name "*.php" -print0 | xargs -0 -n1 php -l

            # 2. Envia tudo para o InfinityFree
            - name: FTP Deploy
              uses: SamKirkland/FTP-Deploy-Action@v4.3.4
              with:
                  server: ${{ secrets.FTP_SERVER }}
                  username: ${{ secrets.FTP_USERNAME }}
                  password: ${{ secrets.FTP_PASSWORD }}

                  # ---------------------
                  server-dir: ./serviconnect.online/htdocs/
                  # ---------------------
                  protocol: ftp

                  exclude: |
                      **/.git*
                      **/.git*/**
                      **/.github/**
                      */node_modules/*
                      **/backend/config.local.php
                      **/backend/config.example.php
                      **/database/**
                      **/docs/**
                      **/tests/**
                      **/tools/**
                      **/.local/**
                      **/*.sql
                      **/*.log
                      **/foto/upload_*
                      **/foto/contratante_*
                      **/foto/terceirizada_*
